image:
  repository: harbor.szymonrichert.pl/containers/tatara-memory
  tag: ""
  pullPolicy: IfNotPresent

# imagePullSecrets are cluster-specific; the deploying helmfile supplies them.
imagePullSecrets: []

replicaCount: 1

httpAddr: ":8080"
lightragBaseUrl: "http://tatara-memory-lightrag:9621"
oidcIssuer: "https://auth.szymonrichert.pl/realms/master"
oidcAudience: "tatara-memory"
workerPoolSize: 4
# Per-item ingest timeout (Go duration). "0" disables the deadline.
ingestItemTimeout: "60s"
# http.Server WriteTimeout: a raw socket write deadline armed BEFORE the
# handler runs (net/http/server.go), NOT a handler-abort bound - it does not
# cancel the request context and does not stop a parked handler; it only
# fails the eventual response write once the deadline has passed, tearing
# the connection down with no HTTP status. This is why it provides NO
# protection against the tatara-memory#85/#86 hang class (that is
# ingestCreateJobTimeout below, the load-bearing fix); it exists only as a
# best-effort backstop for a response write that genuinely never completes
# (e.g. a client that stops reading).
#
# /code-graph:bulk opts out of it entirely (internal/httpapi/codegraph.go
# clears the write deadline via http.ResponseController) because its single
# Reconcile transaction legitimately runs 50-194s+ on a large repo - well
# past any value set here - and losing that response after a successful
# commit would make the ingest client retry an already-successful push,
# tripling load on the shared Postgres pool this whole fix protects.
#
# 240s is only a backstop against every OTHER route, not tuned against any
# known legitimate duration on this repo's own routes. Do not assume it is
# ordered against tatara-memory-repo-ingester's HTTP client timeout: the
# #85/#86 incident observed a 300s client timeout, but that ingester's code
# default is 60s - whichever value is actually deployed, this chart's
# default does not guarantee an ordering against it either way. "0" disables
# it.
httpWriteTimeout: "240s"
# Deadline for /memories:bulk's CreateJob transaction, including the DB pool
# acquire. This is the load-bearing bound: when the shared Postgres pool is
# exhausted (e.g. by a stuck backend, tatara-memory#86), BeginTx now fails
# fast with this deadline instead of parking the request until the caller
# gives up, converting a 300s hang + 499 into a fast 429 + Retry-After that
# the ingest client already retries. "0" disables it.
ingestCreateJobTimeout: "10s"
# Budget for one /memories:bulk reconcile purge, end to end, including the time
# spent waiting out LightRAG's pipeline lock (tatara-memory#90, #91).
#
# A LightRAG document delete returns in milliseconds but then holds the pipeline
# lock for the 6-42s its knowledge-graph rebuild takes (41.85s worst case
# measured in #90). While it is held LightRAG answers concurrent deletes HTTP
# 200 with body status="busy". The purge is serial over reconcile files, so
# file N+1 waits out the lock file N just took - which is why this is one budget
# for the whole batch rather than a per-file or per-attempt bound.
#
# 45s covers a single full lock hold (so nothing is shed that waiting would have
# saved) and stays under tatara-memory-repo-ingester's 60s HTTP client default.
# Whatever does not fit comes back as 429 + Retry-After (an exhausted budget is
# backpressure, not unavailability - tatara-memory#80) with the files already
# purged cleared from the source index, so the client's retry resumes rather
# than restarting. Raise it only in step with that client's timeout. "0"
# disables the bound, leaving the purge governed only by the request context.
memoryPurgeBudget: "45s"

# --- Admission control on the bulk write routes (tatara-memory#79/#80/#82/#87)
#
# One Postgres connection pool is shared by /memories:bulk, /code-graph:bulk,
# every /code/* read, the ingest worker pool, the analytics worker and /readyz.
# A single /code-graph:bulk reconcile holds one connection for its whole
# transaction (measured 50-194s on a large repo), so an unbounded concurrent
# re-ingest wave could take every connection and starve /memories:bulk's
# CreateJob until its deadline fired - which the API then reported as 503.
#
# The two budgets below bound how many bulk requests execute at once, so the
# pool always keeps connections for everything else. The app REFUSES TO START
# if memoriesBulkMaxInFlight + codeGraphBulkMaxInFlight + workerPoolSize +
# analyticsMaxConcurrency is not strictly less than dbMaxOpenConns: a budget
# that can still exhaust the pool is a limiter that cannot do its job.
# Defaults: 4 + 2 + 4 + 2 = 12 < 20.
#
# A request that cannot get a slot within admissionWait is SHED with HTTP 429
# and a Retry-After header (base admissionRetryAfter, jittered up to +50% per
# response so a shed wave does not re-arrive in lockstep). 503 is now reserved
# for genuine upstream unavailability. Clients must treat 429 as retryable and
# honour Retry-After.
#
# "0" disables a budget (unbounded, pre-admission-control behaviour) and skips
# the oversubscription check for it.
memoriesBulkMaxInFlight: 4
codeGraphBulkMaxInFlight: 2
admissionWait: "5s"
admissionRetryAfter: "5s"

# Shared Postgres pool limits. Raised from the previous hard-coded 10, which
# could not fit the admission budgets plus the ingest workers plus reads;
# tatara-memory#87 measured the Postgres side healthy at 44/100 connections
# during a shedding burst, so the binding constraint was this client-side cap.
# Keep replicaCount * dbMaxOpenConns comfortably below the cluster's
# max_connections.
dbMaxOpenConns: 20
dbMaxIdleConns: 5

# --- Connection-hold bounds (tatara-memory#89)
#
# The incident: backends owned by this service's role on mem-mtg-pg grew from 4
# to 87 over 5.5h and never terminated, exhausting all 97 non-superuser
# connection slots (SQLSTATE 53300, "remaining connection slots are reserved for
# roles with the SUPERUSER attribute"). The project's memory API was down 13h+
# and the rollout deadlocked, because /readyz pings the database and could not
# get a slot while /healthz (no DB dependency) kept the wedged pod alive.
# Admission control bounds how many connections are taken; these bound how long
# any one of them is held.
#
# dbConnMaxLifetime/dbConnMaxIdleTime recycle pooled connections on a fixed
# cadence. Without them a connection is reused forever, so a client-side
# connection whose server-side backend has become wedged is never replaced -
# there is no client-side ceiling at all on how long one backend is held.
# "0" means unlimited for either one.
dbConnMaxLifetime: "30m"
dbConnMaxIdleTime: "5m"
# pgStatementTimeout / pgIdleInTransactionTimeout are sent as Postgres session
# parameters on every connection. They are the server-side half of the same
# guarantee, and the only half that still works when the client is gone: a
# Postgres backend does not observe a client disconnect while it is mid
# statement, which is why the incident's backends survived every pod restart.
#
# Both are deliberately generous - backstops against pathology, not latency
# budgets. /code-graph:bulk's single Reconcile transaction legitimately runs
# 50-194s+ on a large repo, so pgStatementTimeout sits well above that.
# pgIdleInTransactionTimeout can be tighter: after the #89 fix moved community
# labelling out of the analytics transaction, the only work between a
# transaction's statements is Go-side row marshalling (milliseconds).
# "0" disables either one.
pgStatementTimeout: "5m"
pgIdleInTransactionTimeout: "2m"
# Max concurrent code-graph analytics recomputes. Each in-flight recompute holds
# one pooled connection for its write transaction, so this is a term in the
# oversubscription check above. It must be an explicit number: the worker's own
# fallback is GOMAXPROCS, which would make the pool budget depend on which node
# the pod lands on. Analytics is background batch work and must not crowd out
# the request path, hence a small default.
analyticsMaxConcurrency: 2
# Deadline for ONE code-graph analytics recompute, end to end. Without it the
# worker inherits the process-lifetime context, so a wedged run holds its
# database work for as long as the pod lives - the incident observed a single
# transaction whose age grew 1800s per 1800s of wall clock for 5.5h. The
# incident's own recompute took 76.6s, so 10m is ~8x the real worst case: a run
# that hits this is wedged, not slow. "0" disables it.
analyticsRecomputeTimeout: "10m"

# --- Startup wait on Postgres (tatara-memory#102)
#
# The incident: all three mem-* stacks are re-rendered at 03:30Z every 86400s,
# which bounces every Postgres, Neo4j and LightRAG pod NotReady for 4-8 min.
# The API's startup gate was a hardcoded, non-configurable 60s wait whose expiry
# exited the process, so the kubelet took over the retrying with CrashLoopBackOff
# (10 -> 20 -> 40 -> 80 -> 160 -> 300s) - strictly slower than the app's own poll
# loop. Six restarts per pod, and the API stayed down LONGER than the database
# outage that caused it.
#
# The wait now runs behind the readiness probe: the container serves /healthz
# throughout (so the kubelet leaves it alone) and reports 503 on /readyz until
# Postgres is reachable and the schema is migrated. "0" means wait for as long
# as the pod lives, which is the recommended setting - an unready pod holds the
# rollout and keeps the previous ReplicaSet serving, which is what you want. A
# positive value only stops the retrying; the process still never exits.
dbWaitTimeout: "0"
# First retry interval; the app doubles it up to 30s.
dbWaitInterval: "2s"


logLevel: "info"
otlpEndpoint: ""

pgHost: "tatara-memory-postgres-rw"
pgPort: 5432
pgDb: "tatara_memory"
pgUser: "tatara_memory"

# PG_DSN is projected inline from pgPasswordSecret (cnpg cluster app secret).
# Set existingSecret to inject an operator-managed Secret via envFrom;
# no default Secret is generated (there are no unconsumed keys to store).
existingSecret: ""
pgPasswordSecret: "tatara-memory-postgres-app"
pgPasswordKey: "password"

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  host: ""
  path: "/"
  clusterIssuer: ""
  tlsSecretName: ""

serviceMonitor:
  enabled: true
  interval: "30s"
  scrapeTimeout: "10s"

# PrometheusRule for tatara-memory's own runtime metrics. Mirrors the operator
# chart's knobs and stays cluster-agnostic (rule 14): additionalLabels defaults
# to {} and any ruleSelector label the cluster's Prometheus needs is set from
# the deploying helmfile (per-release values), never baked here. Alertmanager
# routing is a cluster-side concern.
prometheusRule:
  enabled: true
  # Severity applied to the active-failure (Class-B) alerts. The MemoryDown
  # deadman is always critical.
  severityLabel: warning
  additionalLabels: {}
  # Fraction of HTTP responses that may be 5xx before MemoryHigh5xx fires.
  http5xxRatio: 0.05
  # Bulk requests/s shed with 429 by admission control before
  # MemoryBulkAdmissionShedding fires. 0.05/s is ~30 shed requests over the
  # 10m window: a sustained overload, not a single burst.
  admissionShedRate: 0.05
  # p99 request-latency threshold (seconds) for MemoryRetrievalLatencyHigh.
  # Must stay below 10s: the histogram uses prometheus.DefBuckets whose largest
  # finite bucket is 10s, so p99 saturates there.
  retrievalLatencyP99Seconds: 2.5
  # Fraction of the Postgres pool that may be in use before MemoryDBPoolSaturated
  # fires. The whole process shares one pool, /readyz included.
  dbPoolSaturationRatio: 0.8
  # Seconds spent waiting for a pool connection, per second of wall clock,
  # before MemoryDBPoolWaiting fires. Anything sustained above 0 means callers
  # are queuing.
  dbPoolWaitSecondsPerSecond: 0.5

networkPolicy:
  enabled: true
  # postgresClusterName matches the cnpg.io/cluster label on the cnpg pods.
  # Defaults to "<release>-postgres" when empty (matches the cnpg/cluster subchart default).
  postgresClusterName: ""
  # neo4jName matches the helm.neo4j.com/neo4j.name label on the neo4j pod.
  # Defaults to .Values.neo4j.neo4j.name when empty.
  neo4jName: ""

postgres:
  enabled: true
  # cnpg/cluster subchart values pass through to the postgres cluster.
  # tatara_memory + lightrag share ONE database to keep deploy simple;
  # pgvector ships with the cnpg postgres image. postInitApplicationSQL
  # runs on the tatara_memory database (as the app user) so the extension
  # lives where lightrag's vector store needs it.
  #
  # These are cnpg Cluster SPEC values, not workload env config, so the
  # "no lists / no plain ENVs in values.yaml" rule does not apply to them
  # (same carve-out postInitApplicationSQL already relies on). Sizes stay
  # cluster-agnostic: no storageClass is set anywhere, so every volume lands
  # on the deploying cluster's default StorageClass.
  #
  # Every storage field below is REQUIRED and template-validated
  # (tatara-memory.validatePostgres). Leaving one out is what took the
  # platform's memory backends down three times, so the chart refuses to
  # render rather than silently fall back to a cnpg default:
  #
  #   2026-07-05  WAL shared the PGDATA volume, filled it, and postgres could
  #               no longer write; /memories:bulk 503'd (tatara-operator#238).
  #   2026-07-06  a standby-resync WAL burst overran a 2Gi WAL volume whose
  #               slot cap already claimed half of it, crashlooping both
  #               replicas.
  #   2026-07-25  a diverged replica's orphan replication slot pinned WAL on
  #               the primary with nothing to bound it (tatara-helmfile#263).
  cluster:
    instances: 3
    storage:
      # PGDATA only. WAL is on its own volume below. cnpg's chart default is
      # 8Gi; 20Gi is the size the platform's own memory backend has run on
      # since the 2026-07-05 fill.
      size: 20Gi
    walStorage:
      # A DEDICATED WAL volume. cnpg's chart defaults this to disabled, which
      # puts pg_wal back on the PGDATA volume - the 2026-07-05 failure. cnpg
      # accepts adding walStorage to a cluster that never had it, but REJECTS
      # disabling or shrinking it afterwards, so this is a one-way door.
      enabled: true
      size: 10Gi
    postgresql:
      parameters:
        # Caps how much WAL one replication slot may force the primary to
        # retain for a lagging, stuck, or permanently diverged standby. Past
        # the cap postgres invalidates that slot (the standby must re-clone)
        # instead of filling the volume and taking the PRIMARY's writes down
        # with it. Without this a single orphan slot grows unbounded.
        # MUST NOT exceed half of walStorage.size (validated at render time):
        # the other half is what checkpoint WAL and any archive backlog need.
        max_slot_wal_keep_size: 5120MB
    initdb:
      database: tatara_memory
      owner: tatara_memory
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;

neo4j:
  enabled: true
  # neo4j chart requires `neo4j.name` and `volumes.data.mode` at top level.
  # Password value is provided via the SOPS-encrypted values overlay
  # (values/tatara-memory/default.secrets.yaml).
  # disableLookups: true tells the chart to skip its in-cluster pull-secret
  # lookup (helmfile template-mode breaks lookups). The pull secret itself is
  # cluster-specific and is supplied by the deploying helmfile.
  disableLookups: true
  neo4j:
    name: tatara-neo4j
    edition: community
    acceptLicenseAgreement: "yes"
  image:
    imagePullSecrets: []
  volumes:
    data:
      mode: defaultStorageClass
      defaultStorageClass:
        requests:
          storage: 10Gi
  services:
    # neo4j chart's "default" service is named after the release (tatara-memory)
    # which collides with the tatara-memory app's own service of the same name.
    # Disable it; use the "neo4j" service (renamed via -lb-neo4j suffix) with
    # type=ClusterIP instead. Lightrag connects to bolt://tatara-neo4j-lb-neo4j:7687.
    default:
      enabled: false
    neo4j:
      enabled: true
      spec:
        type: ClusterIP
    admin:
      enabled: false
    internals:
      enabled: false

lightrag:
  enabled: true
  # Share the parent cluster's postgres + single application database.
  # Vector extension is pre-installed on the same db via postInitApplicationSQL.
  postgresHost: tatara-memory-postgres-rw
  postgresPort: "5432"
  postgresDatabase: tatara_memory
  postgresUser: tatara_memory
  neo4jUri: bolt://tatara-neo4j-lb-neo4j:7687
  networkPolicy:
    # Match the cnpg.io/cluster label on the postgres pods (parent pgHost prefix).
    postgresClusterName: tatara-memory-postgres
    # Match the helm.neo4j.com/neo4j.name label on the neo4j pod.
    neo4jName: tatara-neo4j
  secrets:
    openai:
      existingSecret: ""
      existingSecretKey: LLM_BINDING_API_KEY
      value: ""
    postgres:
      existingSecret: tatara-memory-postgres-app
      existingSecretKey: password
      value: ""
    neo4j:
      existingSecret: tatara-neo4j-password
      existingSecretKey: NEO4J_PASSWORD
      value: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# Scheduled retrieval-quality eval (issue #46). Opt-in: when enabled a CronJob
# runs the /eval binary against targetBaseUrl on `schedule`, scores the golden
# set, and POSTs recall@k/MRR to the operator push-receiver at pushUrl.
# Disabled by default so the chart adds nothing unless a deploy opts in.
# The eval pod is excluded from this chart's app NetworkPolicy (its egress to
# the operator/target is cluster-specific); a default-deny cluster must grant
# the eval pod (app.kubernetes.io/component=eval) egress at the deploy layer.
eval:
  enabled: false
  # Standard cron expression (default: top of every hour).
  schedule: "0 * * * *"
  # Dedicated throwaway eval-memory base URL. Seeding mutates the LightRAG store
  # (idempotency-keyed, so stable across runs), so this MUST NOT point at prod.
  # The chart only takes the URL; provisioning the target is a helmfile concern.
  targetBaseUrl: ""
  # Operator push-receiver internal endpoint, e.g.
  # http://tatara-operator-internal.tatara.svc:8082/internal/metrics/push
  # Empty disables the push (the run still scores and gates on the floor).
  pushUrl: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
