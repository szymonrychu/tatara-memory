suite: configmap
templates:
  - configmap.yaml
release:
  name: tm
  namespace: tatara
tests:
  - it: renders ConfigMap with UPPER_SNAKE keys
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: tm-tatara-memory
      - isNotNullOrEmpty:
          path: data.HTTP_ADDR
      - isNotNullOrEmpty:
          path: data.LIGHTRAG_BASE_URL
      - isNotNullOrEmpty:
          path: data.OIDC_ISSUER
      - isNotNullOrEmpty:
          path: data.OIDC_AUDIENCE
      - isNotNullOrEmpty:
          path: data.WORKER_POOL_SIZE
      - isNotNullOrEmpty:
          path: data.INGEST_ITEM_TIMEOUT
      - isNotNullOrEmpty:
          path: data.HTTP_WRITE_TIMEOUT
      - isNotNullOrEmpty:
          path: data.INGEST_CREATE_JOB_TIMEOUT
      - isNotNullOrEmpty:
          path: data.PG_MAX_OPEN_CONNS
      - isNotNullOrEmpty:
          path: data.PG_MAX_IDLE_CONNS
      - isNotNullOrEmpty:
          path: data.PG_CONN_MAX_LIFETIME
      - isNotNullOrEmpty:
          path: data.PG_CONN_MAX_IDLE_TIME
      - isNotNullOrEmpty:
          path: data.PG_STATEMENT_TIMEOUT
      - isNotNullOrEmpty:
          path: data.PG_IDLE_IN_TRANSACTION_TIMEOUT
      - isNotNullOrEmpty:
          path: data.ANALYTICS_RECOMPUTE_TIMEOUT
      - isNotNullOrEmpty:
          path: data.LOG_LEVEL
  # tatara-memory#89: these bounds are the whole fix on the deploy side, so pin
  # the values.yaml -> ConfigMap mapping rather than only its non-emptiness.
  - it: projects the connection-lifetime bounds from values
    set:
      pgMaxOpenConns: 12
      pgConnMaxLifetime: "45m"
      pgStatementTimeout: "6m"
      pgIdleInTransactionTimeout: "90s"
      analyticsRecomputeTimeout: "15m"
    asserts:
      - equal:
          path: data.PG_MAX_OPEN_CONNS
          value: "12"
      - equal:
          path: data.PG_CONN_MAX_LIFETIME
          value: "45m"
      - equal:
          path: data.PG_STATEMENT_TIMEOUT
          value: "6m"
      - equal:
          path: data.PG_IDLE_IN_TRANSACTION_TIMEOUT
          value: "90s"
      - equal:
          path: data.ANALYTICS_RECOMPUTE_TIMEOUT
          value: "15m"
  - it: rejects any kebab-case keys leaking through
    asserts:
      - isNull:
          path: data.http-addr
      - isNull:
          path: data.lightrag-base-url
      - isNull:
          path: data.oidc-issuer
